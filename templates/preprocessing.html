<!DOCTYPE html>
<html>
<head>
    <title>Weather Prediction</title>
    <style>
        body { display: flex; height: 100vh; margin: 0; font-family: Arial; background: #eef2f3; }
        .sidebar { width: 260px; background: white; padding: 25px; border-right: 1px solid #ccc; display: flex; flex-direction: column; gap: 15px; }
        .main { flex-grow: 1; padding: 40px; position: relative; }
        .btn { background: #88f1ad; border: 1px solid #99b; padding: 12px; font-weight: bold; cursor: pointer; border-radius: 5px; width: 100%; text-decoration: none; text-align: center; color: black; display: block; }
        .btn:hover { background: #92c5d6; }
        .display-box { background: white; border: 1px solid #aaa; height: 70%; overflow: auto; padding: 15px; border-radius: 5px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { border: 1px solid #ddd; padding: 8px; }
    </style>
</head>
<body>
   

<div class="sidebar">
    <form action="/upload" method="post" enctype="multipart/form-data">
        <input type="file" name="file" id="csv_file" hidden onchange="this.form.submit()">
        <button type="button" class="btn" onclick="document.getElementById('csv_file').click()">Load CSV</button>
    </form>

    <form action="/process" method="post" style="display: flex; flex-direction: column; gap: 15px;">
        <button type="submit" name="action" value="missing" class="btn">Missing Value</button>
        <!-- <button type="submit" name="action" value="scaling" class="btn">Feature Scaling</button> -->
        <button type="submit" name="action" value="clear" class="btn">Clear</button>
    </form>

   <!-- Save CSV (Form နှင့် ရေးထားပုံ) -->
    <form action="/save" method="get">
        <button type="submit" class="btn">Save as CSV</button>
    </form>
    <div style="margin-top: auto;">
        <a href="/" class="btn" style="background: #88f1ad;"><< Home</a>
    </div>
</div>

<div class="main">
    <h3>Status: {{ msg }}</h3>
    <div class="display-box">
        {% if tables %}
            {% for table in tables %}
                {{ table|safe }}
            {% endfor %}
        {% else %}
            <p>Waiting for data...</p>
        {% endif %}
    </div>
    
    <a href="{{ url_for('training') }}" class="btn" style="width: 150px; position: absolute; bottom: 40px; right: 40px; text-decoration: none;">Next >></a>
</div>

</body>
</html>
